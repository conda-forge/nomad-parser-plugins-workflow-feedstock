schema_version: 1

context:
  name: nomad-parser-plugins-workflow
  version: "1.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/nomad_parser_plugins_workflow-${{ version }}.tar.gz
  sha256: 359553d8ca261a7bd310f99f108086497dae5ca80adbfe826bb7d3e96bcc531d

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0.0
    - setuptools-scm >=8.0
    - pip
  run:
    - ase >=3.22
    - python >=${{ python_min }}
    - nomad-lab >=1.3.13
    - nomad-schema-plugin-simulation-workflow >=1.0.1
    - nomad-schema-plugin-run >=1.0.1
    - lxml >=5.2
    - asr ==0.4.1
    - xarray >=0.20.1
    - phonopy >=2.35,<=2.38
    - h5py >=3.11.0
    - pydantic >=1.10.8
    - netcdf4 <=1.7.2
    - h5netcdf

tests:
  - python:
      imports:
        - workflowparsers
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Collection of NOMAD parsers for workflow engines.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/nomad-coe/workflow-parsers

extra:
  recipe-maintainers:
    - jan-janssen
